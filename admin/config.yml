backend:
  name: github
  repo: kazikate/Kate-Marifairy
  branch: main

media_folder: "/assets"
public_folder: "/assets"

collections:
  - name: "site_ayarlari"
    label: "Site Yönetimi"
    files:
      - label: "Twin Profili"
        name: "twin"
        file: "twin.json"
        # Medya ayarlarını DOSYA seviyesine taşıdık:
        media_folder: "/assets/twin"
        public_folder: "/assets/twin"
        fields:
          - {label: "Profil Fotoğrafı", name: "profilePhoto", widget: "image"}
          - {label: "Modal Fotoğrafı", name: "modalPhoto", widget: "image"}
          - label: "Mini İkonlar"
            name: "miniIcons"
            widget: "list"
            fields:
              - {label: "Platform Adı", name: "platform", widget: "string"}
              - {label: "URL (Link)", name: "url", widget: "string"}
              - {label: "İkon (Mini)", name: "icon", widget: "image"}
          - label: "Bağlantılar (Normal İkonlar)"
            name: "links"
            widget: "list"
            fields:
              - {label: "Platform Adı", name: "platform", widget: "string"}
              - {label: "Kullanıcı Adı", name: "username", widget: "string", required: false}
              - {label: "URL (Link)", name: "url", widget: "string"}
              - {label: "İkon (Normal)", name: "bg", widget: "image"}

      - label: "Kazikate Profili"
        name: "kazikate"
        file: "kazikate.json"
        # Medya ayarlarını DOSYA seviyesine taşıdık:
        media_folder: "/assets/kazikate"
        public_folder: "/assets/kazikate"
        fields:
          - {label: "Profil Fotoğrafı", name: "profilePhoto", widget: "image"}
          - {label: "Modal Fotoğrafı", name: "modalPhoto", widget: "image"}
          - label: "Mini İkonlar"
            name: "miniIcons"
            widget: "list"
            fields:
              - {label: "Platform Adı", name: "platform", widget: "string"}
              - {label: "URL (Link)", name: "url", widget: "string"}
              - {label: "İkon (Mini)", name: "icon", widget: "image"}
          - label: "Bağlantılar (Normal İkonlar)"
            name: "links"
            widget: "list"
            fields:
              - {label: "Platform Adı", name: "platform", widget: "string"}
              - {label: "Kullanıcı Adı", name: "username", widget: "string", required: false}
              - {label: "URL (Link)", name: "url", widget: "string"}
              - {label: "İkon (Normal)", name: "bg", widget: "image"}

      - label: "Müzik Listesi"
        name: "music"
        file: "music.json"
        fields:
          - label: "Şarkılar (Playlist)"
            name: "playlist"
            widget: "list"
            fields:
              - {label: "Şarkı Adı", name: "title", widget: "string"}
              - {label: "Sanatçı", name: "artist", widget: "string"}
              - {label: "Şarkı Dosyası (URL)", name: "file", widget: "string"}
