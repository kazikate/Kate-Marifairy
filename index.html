<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kate Marifairy - Biography</title>
    <link rel="icon" type="image/png" href="https://kazikate.github.io/Biography/assets/twin/Twinbio3.jpg">
    
    <meta name="color-scheme" content="dark">
    <meta property="og:title" content="Kate Marifairy - Biography">
    <meta property="og:description" content="">
    <meta property="og:image" content="https://kazikate.github.io/Biography/assets/twin/Twinbio2.jpg">
    <meta property="og:url" content="https://kazikate.github.io/Biography/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@katemarifairy">
    <meta name="twitter:title" content="Kate Marifairy - Biography">
    <meta name="twitter:description" content="">
    <meta name="twitter:image" content="https://kazikate.github.io/Biography/assets/twin/Twinbio2.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        @import url('https://api.fontshare.com/css?f[]=chillax@300,400,500,600,700&display=swap');

        :root {
            color-scheme: dark;
            --dark-bg: #000000;
            --link-bg: #1F1925;
            --link-hover: #31283D;
            --text-light: #DCBAF7;
            --accent-purple: #9d50ff;
            --lyric-accent: #DCBAF7;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --image-height-vh: 50vh;
            --transition-start: 60%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            --ui-accent: #A48BB8;
            --ui-light: #DCBAF7;
            transition: background-color 0.5s ease, color 0.5s ease, --ui-accent 0.8s ease, --ui-light 0.8s ease;
        }

        body.theme-lyric-on {
            --ui-accent: var(--lyric-accent);
            --ui-light: var(--lyric-accent);
        }

        ::selection { background-color: rgba(157, 80, 255, 0.35); }
        ::-moz-selection { background-color: rgba(157, 80, 255, 0.35); }

        .profile-img-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: var(--image-height-vh);
            z-index: 1;
            max-width: 600px;
            mask-image: linear-gradient(to bottom, black var(--transition-start), transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black var(--transition-start), transparent 94%);
            transition: opacity 0.8s ease-out;
            opacity: 0;
            will-change: transform;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            isolation: isolate;
        }
        .profile-img-container.is-visible { opacity: 1; transition-delay: 0.1s; }

        .content-wrapper {
            width: 100%;
            max-width: 600px;
            margin-top: calc(var(--image-height-vh) * 0.8 - 10px);
            z-index: 2;
            position: relative;
            margin-left: auto;
            margin-right: auto;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 0 20px 40px;
            text-align: center;
            box-sizing: border-box;
            margin: 0 auto;
        }
        .bottom-blur-layer {
            position: fixed;
            bottom: 0;
            z-index: 9;
            pointer-events: none;
            height: 100px;
            width: 100%;
            max-width: 600px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            mask-image: linear-gradient(to top, black 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, transparent 100%);
        }

        .profile-img-visual {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: url('https://kazikate.github.io/Biography/assets/Twinbio.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            filter: blur(0px);
            transition: background-image 0.5s ease, filter 0.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
            will-change: filter, transform;
        }

        body.is-modal-open .profile-img-visual { transform: scale(1.08); }
        .dim-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            opacity: 0;
            transition: opacity 0.1s linear;
            will-change: opacity;
        }
        .username {
            font-family: 'Chillax', sans-serif;
            font-size: 2.5em;
            font-weight: 500;
            margin-top: 0px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            transform: translateY(50px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            opacity: 0;
            max-width: 600px;
        }
        .username.is-visible { opacity: 1; transform: translateY(30px); transition-delay: 0.3s; }
        
        .bio {
            font-size: 0.97em;
            font-weight: 550;
            opacity: 0;
            max-width: 90%; 
            margin: 5px auto 20px auto !important; 
            line-height: 1.5; 
            transform: translateY(18px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .bio.is-visible { opacity: 0.8; transform: translateY(0); transition-delay: 0.5s; }

        .social-icons-mini {
            display: flex;                
            justify-content: center;      
            align-items: center;          
            flex-wrap: wrap;              
            gap: 15px;                    
            margin-top: 10px !important;      
            margin-bottom: 10px !important;  
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            max-width: 600px;
        }
        .social-icons-mini.is-visible { 
            opacity: 1; 
            transform: translateY(0); 
            transition-delay: 0.7s; 
        }
        .social-icons-mini a {
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: transform 0.2s, opacity 0.2s;
            line-height: 0;
            -webkit-tap-highlight-color: transparent;
            margin: 0 !important; 
        }
        .social-icons-mini a:hover { 
            transform: scale(1.15); 
        }
        .social-icons-mini .mini-icon {
            width: 36px;  
            height: 36px;
            object-fit: visible; 
        }
        
        .links-section {
            padding-top: 10px; 
        }
        .link-button {
            display: flex;
            align-items: center;
            background-color: var(--link-bg);
            color: var(--text-light);
            text-decoration: none;
            padding: 15px 20px;
            margin: 15px 0;
            border-radius: 38px;
            font-weight: 600;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            height: 38px;
            position: relative;
            opacity: 0;
            transform: translateY(50px);
            transition: background-color 0s, box-shadow 0.2s, opacity 0.6s ease-out, transform 0.6s ease-out;
            -webkit-tap-highlight-color: transparent;
        }
        .link-button.is-visible { opacity: 1; transform: translateY(0); }
        @keyframes press-link {
            0% { transform: scale(1) translateZ(0); }
            50% { transform: scale(0.98) translateZ(0); }
            100% { transform: scale(1) translateZ(0); }
        }
        .link-button.press { animation: press-link 0.2s ease-out; pointer-events: none; }

        .bio-emoji {
            width: 1.2em;
            height: 1.2em;
            vertical-align: -0.1em;
            margin: 0.1px;
            display: inline-block;
        }
        .link-img-placeholder {
            transform: translateX(-11px);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #1F1925;
            margin-right: 0px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0px 0px rgba(0, 0, 0, 0.2);
        }
        .link-text-details {
            flex-grow: 1;
            text-align: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 40px;
        }
        .link-platform { font-weight: 600; display: block; }
        .link-username { font-size: 0.75em; opacity: 0.6; font-weight: 400; display: block; }
        
        .footer-links {
            margin-top: 40px;
            font-size: 1em;
            font-weight: 400;
            margin-bottom: 0px;
            position: relative;
            z-index: 10;
        }
        .footer-links a {
            color: var(--text-light);
            opacity: 0.6;
            text-decoration: none;
            margin: 0 2px;
        }
        .footer-links a:hover { opacity: 1; text-decoration: underline; }
        .footer-links .footer-text { display: inline-block; }
        .no-scroll { overflow: hidden; }

        @media (max-width: 480px) {
            body { padding: 0; }
            .container { padding: 0 20px 40px; }
        }
        @media (min-width: 700px) {
            .profile-img-container, .content-wrapper, .bottom-blur-layer { max-width: 500px; }
            .container { max-width: 800px; padding: 0 0 40px 0; }
            .profile-img-container { height: 550px !important; }
            .content-wrapper { margin-top: 410px !important; } 
            #music-widget {
                left: 50% !important;
                transform: translateX(calc(-50% + 15px)) !important; 
                max-width: 500px !important;
                width: 100% !important;
                padding-left: 0 !important; 
            }
        }

        .image-preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, background-color 0.3s ease;
        }
        .image-preview-modal.is-open {
            opacity: 1;
            background-color: rgba(0, 0, 0, 0.85);
            pointer-events: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .modal-content {
            transform: scale(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-circle-mask {
            width: 85vw;
            height: 85vw;
            max-width: 400px;
            max-height: 400px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(157, 80, 255, 0.4);
            position: relative;
            margin: 0 auto;
        }
        #preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        body.animations-done .link-button { transition-delay: 0s !important; }
        @media (hover: hover) {
            body.animations-done .link-button:hover {
                transform: scale(1.05);
                transition: transform 0.15s ease-out !important;
            }
            body.animations-done .link-button:not(:hover) {
                transform: scale(1);
                transition: transform 0.15s !important;
            }
        }

        .profile-hover-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .profile-hover-layer i {
            color: var(--ui-light);
            font-size: 3.5em;
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .profile-img-container.scrolled-past .profile-hover-layer { opacity: 0 !important; }
        .profile-img-container.scrolled-past .profile-hover-layer i { transform: scale(0.5) !important; }
        .profile-img-container.show-hint .profile-hover-layer { opacity: 1 !important; }
        .profile-img-container.show-hint .profile-hover-layer i { transform: scale(1) !important; }

        .social-icons-mini img {
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .downloadable-profile-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            z-index: 4;
            pointer-events: auto;
            -webkit-touch-callout: default !important;
        }
        .profile-img-container.disable-hover .profile-hover-layer { opacity: 0 !important; transition: none !important; }
        .profile-img-container.disable-hover .profile-hover-layer i { transform: scale(0.5) !important; transition: none !important; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background-color: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background-color: rgba(157, 80, 255, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(157, 80, 255, 0.8); }

        #music-widget {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .music-cover-container {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            position: relative;
            z-index: 4;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 2px solid var(--ui-accent);
            overflow: hidden;
            background-color: transparent;
            transition: background-color 0.5s ease, border-color 0.8s ease;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .music-cover-container.solid-bg { background-color: #120e18; }
        .default-glass-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            transition: opacity 0.4s ease;
        }
        .default-glass-cover svg {
            width: 22px;
            height: 22px;
            color: var(--ui-accent);
            transition: color 0.8s ease;
        }
        .track-cover-layer {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        .spin-anim { animation: spin-record 5s linear infinite; }
        @keyframes spin-record { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .music-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .music-cover-container.is-active .music-overlay { opacity: 1; }
        .music-overlay svg {
            width: 20px;
            height: 20px;
            color: var(--ui-accent);
            position: absolute;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.15s ease-out, transform 0.15s ease-out, color 0.8s ease;
            pointer-events: none;
        }
        .music-overlay svg.show-icon {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.8s ease;
        }
        .music-waves {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 20px;
            position: absolute;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.15s ease-out, transform 0.15s ease-out;
            pointer-events: none;
        }
        .music-waves.show-wave {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #forward-icon {
            transform: translateX(-15px) scale(0.5);
            transition: opacity 0.15s ease-out, transform 0.15s ease-out, color 0.8s ease;
        }
        #forward-icon.show-forward {
            opacity: 1;
            transform: translateX(0) scale(1);
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.8s ease;
        }
        .wave-line {
            width: 3px;
            height: 100%;
            background-color: var(--ui-accent);
            border-radius: 3px;
            animation: wave-bounce 1s ease-in-out infinite alternate;
            transition: background-color 0.8s ease;
        }
        .wave-line:nth-child(1) { animation-delay: 0.0s; }
        .wave-line:nth-child(2) { animation-delay: 0.3s; height: 60%; }
        .wave-line:nth-child(3) { animation-delay: 0.6s; height: 80%; }
        .wave-line:nth-child(4) { animation-delay: 0.9s; height: 50%; }
        @keyframes wave-bounce {
            0% { height: 20%; opacity: 0.5; }
            100% { height: 100%; opacity: 1; }
        }

        .music-pill {
            position: absolute;
            left: 27px;
            top: 7px;
            height: 45px;
            background: rgba(20, 15, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--ui-accent);
            border-radius: 0 25px 25px 0;
            z-index: 3;
            display: flex;
            align-items: center;
            max-width: 0;
            padding: 0;
            overflow: hidden;
            white-space: nowrap;
            opacity: 0;
            transition: max-width 0.5s cubic-bezier(0.5, 0, 0.1, 1), padding 0.5s cubic-bezier(0.5, 0, 0.1, 1), opacity 0s 0.5s, border-color 0.8s ease;
        }
        .music-pill.show-pill {
            max-width: 250px;
            padding: 0 20px 0 35px;
            opacity: 1;
            transition: max-width 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55), padding 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.1s ease, border-color 0.8s ease;
        }

        .seek-pill {
            position: absolute;
            left: 27px;
            top: 7.8px;
            height: 45px;
            background: rgba(20, 15, 25, 0.6);
            box-sizing: border-box;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--ui-accent);
            border-radius: 0 25px 25px 0;
            z-index: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            opacity: 0;
            width: 100vw;
            max-width: 0;
            padding: 0;
            transition: max-width 0.5s cubic-bezier(0.5, 0, 0.1, 1), padding 0.5s cubic-bezier(0.5, 0, 0.1, 1), opacity 0s 0.5s, border-color 0.8s ease;
        }
        .seek-pill.show-seek {
            max-width: min(calc(85vw - 75px), 380px);
            padding: 0 15px 0 40px;
            opacity: 1;
            z-index: 2;
            transition: max-width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), padding 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.1s ease, border-color 0.8s ease;
        }

        .prev-btn {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 35px;
            height: 35px;
            background: rgba(20, 15, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--ui-accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(0) scale(0.5);
            z-index: 3;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.5, 0, 0.1, 1) 0.1s, opacity 0s 0.6s, scale 0.2s ease, border-color 0.8s ease;
        }
        .prev-btn.show-prev {
            opacity: 1;
            transform: translateY(60px) scale(1);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0s, opacity 0.1s ease, scale 0.2s ease, border-color 0.8s ease;
        }

        .lyric-btn {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 35px;
            height: 35px;
            background: rgba(20, 15, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--ui-accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transform: translateY(60px) translateX(0) scale(0.5);
            opacity: 0;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.5, 0, 0.1, 1) 0s, opacity 0.2s 0.2s, background-color 0.3s, scale 0.2s ease, border-color 0.8s ease;
        }
        .lyric-btn.show-prev {
            transform: translateY(60px) translateX(45px) scale(1);
            opacity: 1;
            z-index: 2;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.15s, opacity 0.1s 0.15s, scale 0.2s ease, border-color 0.8s ease;
        }

        .lyric-btn:active, .prev-btn:active {
            scale: 0.85;
            transition: scale 0.1s ease-out !important;
        }

        .lyric-btn svg {
            position: absolute;
            width: 16px;
            height: 16px;
            color: var(--ui-accent);
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.8s ease;
        }
        .lyric-icon-open { opacity: 1; transform: scale(1) rotate(0deg); }
        .lyric-icon-close { opacity: 0; transform: scale(0.5) rotate(-45deg); pointer-events: none; }
        .lyric-btn.is-active .lyric-icon-open { opacity: 0; transform: scale(0.5) rotate(45deg); pointer-events: none; }
        .lyric-btn.is-active .lyric-icon-close { opacity: 1; transform: scale(1) rotate(0deg); }

        .prev-btn svg { width: 16px; height: 16px; color: var(--ui-accent); transition: color 0.8s ease; }

        .lyrics-container {
            position: absolute;

            left: 0;

            touch-action: none;

        .lyrics-container.show-lyrics {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            padding-top: 220px;
            padding-bottom: 220px;
            padding-left: 15%;
            padding-right: 15%;
            text-align: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: transform 0.6s cubic-bezier(0.25, 1.5, 0.5, 1);
        }

        .lyric-line {
            min-height: 35px;
            line-height: 1.4;
            font-size: 1.15rem;
            font-weight: 700;
            color: rgba(255,255,255,0);
            margin: 15px 0;
            transition: color 0.4s, transform 0.6s cubic-bezier(0.25, 1.5, 0.5, 1), filter 0.4s, opacity 0.4s;
        }
        .lyric-line.active {
            opacity: 1;
            transform: scale(1.2) translateY(0);
            filter: blur(0px);
            color: var(--lyric-accent);
            text-shadow: 0 0 15px var(--lyric-accent);
        }
        .lyric-line.prev {
            opacity: 0.4;
            transform: scale(0.9) translateY(-10px);
            filter: blur(1px);
            color: #FFF;
        }
        .lyric-line.next {
            opacity: 0.4;
            transform: scale(0.9) translateY(10px);
            filter: blur(1px);
            color: #FFF;
        }

        .lyric-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
            margin: 0 5px;
            animation: bounce-dot 0.6s infinite alternate;
        }

        .lyric-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce-dot {

        .music-info { display: flex; flex-direction: column; justify-content: center; transition: opacity 0.3s ease; }

        .panel-wrapper { position: relative; width: 100%; }

        .view-panel.hidden-panel {

        }
