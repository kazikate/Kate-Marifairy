    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        @import url('https://api.fontshare.com/css?f[]=chillax@300,400,500,600,700&display=swap');

        :root {
            color-scheme: dark;
            --dark-bg: #000000;
            --link-bg: #1F1925;
            --link-hover: #31283D;
            --text-light: #DCBAF7;
            --accent-purple: #9d50ff;
            --lyric-accent: #DCBAF7;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --image-height-vh: 50vh;
            --transition-start: 60%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            --ui-accent: #A48BB8;
            --ui-light: #DCBAF7;
            transition: background-color 0.5s ease, color 0.5s ease, --ui-accent 0.8s ease, --ui-light 0.8s ease;
        }

        body.theme-lyric-on {
            --ui-accent: var(--lyric-accent);
            --ui-light: var(--lyric-accent);
        }

        ::selection { background-color: rgba(157, 80, 255, 0.35); }
        ::-moz-selection { background-color: rgba(157, 80, 255, 0.35); }

        .profile-img-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: var(--image-height-vh);
            z-index: 1;
            max-width: 600px;
            mask-image: linear-gradient(to bottom, black var(--transition-start), transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black var(--transition-start), transparent 94%);
            transition: opacity 0.8s ease-out;
            opacity: 0;
            will-change: transform;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            isolation: isolate;
        }
        .profile-img-container.is-visible { opacity: 1; transition-delay: 0.1s; }

        .content-wrapper {
            width: 100%;
            max-width: 600px;
            margin-top: calc(var(--image-height-vh) * 0.8 - 10px);
            z-index: 2;
            position: relative;
            margin-left: auto;
            margin-right: auto;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 0 20px 40px;
            text-align: center;
            box-sizing: border-box;
            margin: 0 auto;
        }
        .bottom-blur-layer {
            position: fixed;
            bottom: 0;
            z-index: 9;
            pointer-events: none;
            height: 100px;
            width: 100%;
            max-width: 600px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            mask-image: linear-gradient(to top, black 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, transparent 100%);
        }

        .profile-img-visual {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: url('https://kazikate.github.io/Biography/assets/Twinbio.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            filter: blur(0px);
            transition: background-image 0.5s ease, filter 0.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
            will-change: filter, transform;
        }

        body.is-modal-open .profile-img-visual { transform: scale(1.08); }
        .dim-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            opacity: 0;
            transition: opacity 0.1s linear;
            will-change: opacity;
        }
        .username {
            font-family: 'Chillax', sans-serif;
            font-size: 2.5em;
            font-weight: 500;
            margin-top: 0px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            transform: translateY(50px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            opacity: 0;
            max-width: 600px;
        }
        .username.is-visible { opacity: 1; transform: translateY(30px); transition-delay: 0.3s; }
        
        .bio {
            font-size: 0.97em;
            font-weight: 550;
            opacity: 0;
            max-width: 90%; 
            margin: 5px auto 20px auto; 
            line-height: 1.5; 
            transform: translateY(18px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .bio.is-visible { opacity: 0.8; transform: translateY(0); transition-delay: 0.5s; }

        /* --- İKON VE LİNK BOŞLUKLARINI ZORLA DÜZENLEME --- */
.bio {
    margin-bottom: 5px !important; /* Biyografi yazısının alt boşluğunu kıs (ikonlara yer aç) */
}

.social-icons-mini {
    margin-top: 10px !important; /* İkonları biyografiye iyice yaklaştır (-13px hissini verir) */
    margin-bottom: 10px !important; /* İkonları altındaki link haplarından uzaklaştır */
}

.links-section {
    padding-top: 1px; /* Üstten ekstra itme kuvveti uygular */
}

            /* --- DİNAMİK İKON DİZİLİMİ (FLEXBOX) --- */

.social-icons-mini {
    display: flex;                /* İkonları yan yana esnek bir kutuya koyar */
    justify-content: center;      /* Kaç ikon olursa olsun tam ekranın ORTASINA hizalar */
    align-items: center;          /* Dikeyde de tam ortalar */
    flex-wrap: wrap;              /* Eğer çok fazla ikon eklersen ve ekrana sığmazsa otomatik alt satıra geçer */
    gap: 15px;                    /* İkonların arasına otomatik ve EŞİT 15px boşluk koyar */
    /* ESKİ MESAFEYİ GERİ GETİREN KISIM */
    margin-top: 2px;      /* Biyografiye olan eski yakınlığı */
    margin-bottom: 28px;  /* Altındaki büyük link haplarına olan uzaklığı */
      
    margin: 15px auto;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    max-width: 600px;
}

.social-icons-mini.is-visible { 
    opacity: 1; 
    transform: translateY(0); 
    transition-delay: 0.7s; 
}

.social-icons-mini a {
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 1;
    transition: transform 0.2s, opacity 0.2s;
    line-height: 0;
    -webkit-tap-highlight-color: transparent;
    margin: 0 !important; /* Eski margin ayarlarını sıfırlayıp Gap'e bırakıyoruz */
}

.social-icons-mini a:hover { 
    transform: scale(1.15); 
}

/* Tüm ikonlar için standart, yuvarlak ve eşit boyut */
.social-icons-mini .mini-icon {
    width: 36px;  
    height: 36px;
    object-fit: visible; /* İkonun kırpılmadan çerçevenin içine tam oturmasını sağlar */
  
}
        
        .links-section {
            padding-top: 10px; /* Üstten ekstra itme boşluğu */
        }

        .link-button {
            display: flex;
            align-items: center;
            background-color: var(--link-bg);
            color: var(--text-light);
            text-decoration: none;
            padding: 15px 20px;
            margin: 15px 0;
            border-radius: 38px;
            font-weight: 600;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            height: 38px;
            position: relative;
            opacity: 0;
            transform: translateY(50px);
            transition: background-color 0s, box-shadow 0.2s, opacity 0.6s ease-out, transform 0.6s ease-out;
            -webkit-tap-highlight-color: transparent;
        }
        .link-button.is-visible { opacity: 1; transform: translateY(0); }

        @keyframes press-link {
            0% { transform: scale(1) translateZ(0); }
            50% { transform: scale(0.98) translateZ(0); }
            100% { transform: scale(1) translateZ(0); }
        }
        .link-button.press { animation: press-link 0.2s ease-out; pointer-events: none; }

        .bio-emoji {
            width: 1.2em;
            height: 1.2em;
            vertical-align: -0.1em;
            margin: 0.1px;
            display: inline-block;
        }
        .link-img-placeholder {
            transform: translateX(-11px);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #1F1925;
            margin-right: 0px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0px 0px rgba(0, 0, 0, 0.2);
        }
        .link-text-details {
            flex-grow: 1;
            text-align: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 40px;
        }
        .link-platform { font-weight: 600; display: block; }
        .link-username { font-size: 0.75em; opacity: 0.6; font-weight: 400; display: block; }
        .footer-links {
            margin-top: 40px;
            font-size: 1em;
            font-weight: 400;
            margin-bottom: 0px;
            position: relative;
            z-index: 10;
        }
        .footer-links a {
            color: var(--text-light);
            opacity: 0.6;
            text-decoration: none;
            margin: 0 2px;
        }
        .footer-links a:hover { opacity: 1; text-decoration: underline; }
        .footer-links .footer-text { display: inline-block; }

        .no-scroll { overflow: hidden; }

        @media (max-width: 480px) {
            body { padding: 0; }
            .container { padding: 0 20px 40px; }
        }
        @media (min-width: 700px) {
            .profile-img-container, .content-wrapper, .bottom-blur-layer { max-width: 500px; }
            .container { max-width: 800px; padding: 0 0 40px 0; }
            .profile-img-container { height: 550px !important; }
            .content-wrapper { margin-top: 410px !important; } 
            #music-widget {
                left: 50% !important;
                transform: translateX(calc(-50% + 15px)) !important; 
                max-width: 500px !important;
                width: 100% !important;
                padding-left: 0 !important; 
            }
        }

        .image-preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, background-color 0.3s ease;
        }
        .image-preview-modal.is-open {
            opacity: 1;
            background-color: rgba(0, 0, 0, 0.85);
            pointer-events: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .modal-content {
            transform: scale(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-circle-mask {
            width: 85vw;
            height: 85vw;
            max-width: 400px;
            max-height: 400px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(157, 80, 255, 0.4);
            position: relative;
            margin: 0 auto;
        }
        #preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        body.animations-done .link-button { transition-delay: 0s !important; }
        @media (hover: hover) {
            body.animations-done .link-button:hover {
                transform: scale(1.05);
                transition: transform 0.15s ease-out !important;
            }
            body.animations-done .link-button:not(:hover) {
                transform: scale(1);
                transition: transform 0.15s !important;
            }
        }

        .profile-hover-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .profile-hover-layer i {
            color: var(--ui-light);
            font-size: 3.5em;
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .profile-img-container.scrolled-past .profile-hover-layer { opacity: 0 !important; }
        .profile-img-container.scrolled-past .profile-hover-layer i { transform: scale(0.5) !important; }
        .profile-img-container.show-hint .profile-hover-layer { opacity: 1 !important; }
        .profile-img-container.show-hint .profile-hover-layer i { transform: scale(1) !important; }

        .social-icons-mini img {
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .downloadable-profile-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            z-index: 4;
            pointer-events: auto;
            -webkit-touch-callout: default !important;
        }
        .profile-img-container.disable-hover .profile-hover-layer { opacity: 0 !important; transition: none !important; }
        .profile-img-container.disable-hover .profile-hover-layer i { transform: scale(0.5) !important; transition: none !important; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background-color: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background-color: rgba(157, 80, 255, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(157, 80, 255, 0.8); }

        #music-widget {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .music-cover-container {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            position: relative;
            z-index: 4;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 2px solid var(--ui-accent);
            overflow: hidden;
            background-color: transparent;
            transition: background-color 0.5s ease, border-color 0.8s ease;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .music-cover-container.solid-bg { background-color: #120e18; }
        .default-glass-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            transition: opacity 0.4s ease;
        }
        .default-glass-cover svg {
            width: 22px;
            height: 22px;
            color: var(--ui-accent);
            transition: color 0.8s ease;
        }
        .track-cover-layer {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        .spin-anim { animation: spin-record 5s linear infinite; }
        @keyframes spin-record { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .music-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .music-cover-container.is-active .music-overlay { opacity: 1; }

        .music-overlay svg {
            width: 20px;
            height: 20px;
            color: var(--ui-accent);
            position: absolute;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.15s ease-out, transform 0.15s ease-out, color 0.8s ease;
            pointer-events: none;
        }
        .music-overlay svg.show-icon {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.8s ease;
        }

        .music-waves {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 20px;
            position: absolute;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.15s ease-out, transform 0.15s ease-out;
            pointer-events: none;
        }
        .music-waves.show-wave {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #forward-icon {
            transform: translateX(-15px) scale(0.5);
            transition: opacity 0.15s ease-out, transform 0.15s ease-out, color 0.8s ease;
        }
        #forward-icon.show-forward {
            opacity: 1;
            transform: translateX(0) scale(1);
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.8s ease;
        }

        .wave-line {
            width: 3px;
            height: 100%;
            background-color: var(--ui-accent);
            border-radius: 3px;
            animation: wave-bounce 1s ease-in-out infinite alternate;
            transition: background-color 0.8s ease;
        }
        .wave-line:nth-child(1) { animation-delay: 0.0s; }
        .wave-line:nth-child(2) { animation-delay: 0.3s; height: 60%; }
        .wave-line:nth-child(3) { animation-delay: 0.6s; height: 80%; }
        .wave-line:nth-child(4) { animation-delay: 0.9s; height: 50%; }
        @keyframes wave-bounce {
            0% { height: 20%; opacity: 0.5; }
            100% { height: 100%; opacity: 1; }
        }

        .music-pill {
            position: absolute;
            left: 27px;
            top: 7px;
            height: 45px;
            background: rgba(20, 15, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--ui-accent);
            border-radius: 0 25px 25px 0;
            z-index: 3;
            display: flex;
            align-items: center;
            max-width: 0;
            padding: 0;
            overflow: hidden;
            white-space: nowrap;
            opacity: 0;
            transition: max-width 0.5s cubic-bezier(0.5, 0, 0.1, 1), padding 0.5s cubic-bezier(0.5, 0, 0.1, 1), opacity 0s 0.5s, border-color 0.8s ease;
        }
        .music-pill.show-pill {
            max-width: 250px;
            padding: 0 20px 0 35px;
            opacity: 1;
            transition: max-width 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55), padding 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.1s ease, border-color 0.8s ease;
        }

        .seek-pill {
            position: absolute;
            left: 27px;
            top: 7.8px;
            height: 45px;
            background: rgba(20, 15, 25, 0.6);
            box-sizing: border-box;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--ui-accent);
            border-radius: 0 25px 25px 0;
            z-index: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            opacity: 0;
            width: 100vw;
            max-width: 0;
            padding: 0;
            transition: max-width 0.5s cubic-bezier(0.5, 0, 0.1, 1), padding 0.5s cubic-bezier(0.5, 0, 0.1, 1), opacity 0s 0.5s, border-color 0.8s ease;
        }
        .seek-pill.show-seek {
            max-width: min(calc(85vw - 75px), 380px);
            padding: 0 15px 0 40px;
            opacity: 1;
            z-index: 2;
            transition: max-width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), padding 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.1s ease, border-color 0.8s ease;
        }

        .prev-btn {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 35px;
            height: 35px;
            background: rgba(20, 15, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--ui-accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(0) scale(0.5);
            z-index: 3;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.5, 0, 0.1, 1) 0.1s, opacity 0s 0.6s, scale 0.2s ease, border-color 0.8s ease;
        }
        .prev-btn.show-prev {
            opacity: 1;
            transform: translateY(60px) scale(1);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0s, opacity 0.1s ease, scale 0.2s ease, border-color 0.8s ease;
        }

        .lyric-btn {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 35px;
            height: 35px;
            background: rgba(20, 15, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--ui-accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transform: translateY(60px) translateX(0) scale(0.5);
            opacity: 0;
            z-index: 1;

    <script>
        // ---------- DEĞİŞKENLER ----------
        let currentDragY = 0;
        const RESISTANCE = 1;
        const MAX_OVERSCROLL = 120;

        const profileImgContainer = document.querySelector('.profile-img-container');
        const profileImgVisual = document.querySelector('.profile-img-visual');
        const dimOverlay = document.querySelector('.dim-overlay');
        const downloadableImg = document.querySelector('.downloadable-profile-img');
        const SPRING_TRANSITION = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        const MODAL_STATE_NAME = 'image_preview_open';

        const audioPlayer = document.getElementById('audio-player');
        const toggleBtn = document.getElementById('music-toggle');
        const defaultCover = document.getElementById('default-cover');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const trackCover1 = document.getElementById('track-cover-1');
        const trackCover2 = document.getElementById('track-cover-2');
        let activeCover = 1;
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const waveIcon = document.getElementById('wave-icon');
        const musicPill = document.querySelector('.music-pill');
        const lyricBtn = document.getElementById('lyric-btn');
        const lyricsContainer = document.getElementById('lyrics-container');
        const lyricsWrapper = document.getElementById('lyrics-wrapper');
        const seekPill = document.getElementById('seek-pill');
        const prevBtn = document.getElementById('prev-btn');
        const seekBar = document.getElementById('seek-bar');
        const currentTimeDisplay = document.getElementById('current-time');
        const totalTimeDisplay = document.getElementById('total-time');

        let isLyricsMode = false;
        let currentLyrics = [];
        let activeLyricIndex = -1;
        let isPlaying = false;
        let isFirstPlay = true;
        let pillTimeout, iconTimeout, clickTimer;
        let shuffledQueue = [];
        let currentQueueIndex = 0;
        let pillCloseTimer;
        let trackLoadTicket = 0;
        let lyricFetchTicket = 0;
        let pressTimer;
        let isLongPress = false;
        let isSeeking = false;
        let advancedControlsTimer, advCloseTimer;
        let shouldReopenAdvanced = false;
        let cachedDuration = 0;
        let animationFrameId;
        let isUserDraggingLyric = false;
        let lyricStartY = 0;
        let initialTransformY = 0;
        let lyricSpring = null;
        let playlist = []; 

        // ---------- FAYDALI FONKSİYONLAR ----------
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function closeAdvancedControls(forceHideSeekbarOnly = false) {
            if (isLyricsMode) {
                if (forceHideSeekbarOnly) seekPill.classList.remove('show-seek');
                clearTimeout(advancedControlsTimer);
                clearTimeout(advCloseTimer);
                return;
            }
            seekPill.classList.remove('show-seek');
            prevBtn.classList.remove('show-prev');
            lyricBtn.classList.remove('show-prev');
            clearTimeout(advancedControlsTimer);
            clearTimeout(advCloseTimer);
            if (!forceHideSeekbarOnly) {
                advCloseTimer = setTimeout(() => {
                    toggleBtn.classList.add('cover-bounce');
                    setTimeout(() => toggleBtn.classList.remove('cover-bounce'), 400);
                }, 350);
            }
        }

        function openAdvancedControls() {
            seekPill.classList.add('show-seek');
            if (!isLyricsMode) {
                prevBtn.classList.add('show-prev');
                lyricBtn.classList.add('show-prev');
            }
            resetAdvancedControlsTimer();
        }

        function resetAdvancedControlsTimer() {
            if (isLyricsMode) return;
            clearTimeout(advancedControlsTimer);
            advancedControlsTimer = setTimeout(() => closeAdvancedControls(), 10000);
        }

        function closePill() {
            musicPill.classList.remove('show-pill');
            clearTimeout(pillCloseTimer);
            pillCloseTimer = setTimeout(() => {
                if (isLyricsMode) {
                    seekPill.classList.add('show-seek');
                } else {
                    toggleBtn.classList.add('cover-bounce');
                    setTimeout(() => toggleBtn.classList.remove('cover-bounce'), 400);
                    if (shouldReopenAdvanced) {
                        shouldReopenAdvanced = false;
                        openAdvancedControls();
                    }
                }
            }, 400);
        }

        function showPill() {
            closeAdvancedControls(true);
            if (isLyricsMode) {
                prevBtn.classList.add('show-prev');
                lyricBtn.classList.add('show-prev');
            }
            musicPill.classList.add('show-pill');
            clearTimeout(pillTimeout);
            clearTimeout(pillCloseTimer);
            pillTimeout = setTimeout(() => closePill(), 3000);
        }

        // ---------- LYRİC SPRING SİSTEMİ ----------
        function syncLyricPosition() {
            if (!isLyricsMode || currentLyrics.length === 0 || isUserDraggingLyric || lyricSpring) return;
            const currentTime = audioPlayer.currentTime;
            let newIndex = -1;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time - 0.3) { newIndex = i; } else break;
            }
            if (newIndex !== activeLyricIndex) {
                animateToLyric(newIndex >= 0 ? newIndex : 0, { springK: 0.04, damping: 0.78 });
            }
        }

        function animateToLyric(targetIndex, options = {}) {
            if (!isLyricsMode || currentLyrics.length === 0) return;
            const targetEl = document.getElementById(`lyric-${targetIndex}`);
            if (!targetEl) return;
            const containerCenter = lyricsContainer.clientHeight / 2;
            const targetY = -(targetEl.offsetTop - containerCenter + (targetEl.clientHeight / 2));

            if (lyricSpring) lyricSpring = null;

            const style = window.getComputedStyle(lyricsWrapper);
            const matrix = new DOMMatrixReadOnly(style.transform);
            const startY = matrix.m42;

            const springK = options.springK || 0.02;
            const damping = options.damping || 0.85;
            lyricSpring = {
                targetY,
                currentY: startY,
                velocity: options.velocity || 0,
                lastTime: performance.now(),
                springK,
                damping,
                targetIndex,
                dragMode: false,
            };
            lyricsWrapper.style.transition = 'none';
            requestAnimationFrame(animateSpring);
        }

        function animateSpring(timestamp) {
            if (!lyricSpring) return;
            const spring = lyricSpring;
            const now = timestamp || performance.now();
            const elapsed = Math.min(now - spring.lastTime, 32);
            spring.lastTime = now;

            const displacement = spring.currentY - spring.targetY;
            const acceleration = -spring.springK * displacement - (1 - spring.damping) * spring.velocity;
            spring.velocity += acceleration * (elapsed / 16.6);
            spring.currentY += spring.velocity * (elapsed / 16.6);

            lyricsWrapper.style.transform = `translateY(${spring.currentY}px)`;

            if (spring.dragMode) {
                requestAnimationFrame(animateSpring);
                return;
            }

            const containerCenter = lyricsContainer.clientHeight / 2;
            let closestIndex = -1, minDistance = Infinity;
            document.querySelectorAll('.lyric-line').forEach((el, index) => {
                const elCenter = el.offsetTop + spring.currentY + (el.clientHeight / 2);
                const dist = Math.abs(containerCenter - elCenter);
                if (dist < minDistance) { minDistance = dist; closestIndex = index; }
            });

            if (closestIndex !== -1 && closestIndex !== activeLyricIndex) {
                document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active', 'prev', 'next'));
                activeLyricIndex = closestIndex;
                const activeEl = document.getElementById(`lyric-${closestIndex}`);
                if (activeEl) {
                    activeEl.classList.add('active');
                    if (closestIndex > 0) document.getElementById(`lyric-${closestIndex - 1}`)?.classList.add('prev');
                    if (closestIndex < currentLyrics.length - 1) document.getElementById(`lyric-${closestIndex + 1}`)?.classList.add('next');
                }
            }

            if (Math.abs(displacement) < 0.5 && Math.abs(spring.velocity) < 0.3 && closestIndex === spring.targetIndex) {

            const lastLine = document.getElementById(`lyric-${currentLyrics.length - 1}`);
            let isOverscrolling = false;

                const maxScrollDown = -(firstLine.offsetTop - containerCenter + (firstLine.clientHeight / 2));
                const maxScrollUp = -(lastLine.offsetTop - containerCenter + (lastLine.clientHeight / 2));
                if (newY > maxScrollDown) {
                    let overScroll = newY - maxScrollDown;
                    overScroll = Math.min(overScroll, MAX_OVERSCROLL);
                    newY = maxScrollDown + overScroll * RESISTANCE;
                    isOverscrolling = true;
                } else if (newY < maxScrollUp) {
                    let overScroll = maxScrollUp - newY;
                    overScroll = Math.min(overScroll, MAX_OVERSCROLL);
                    newY = maxScrollUp - overScroll * RESISTANCE;
                    isOverscrolling = true;
                }
            }
            currentDragY = newY;
            if (lyricSpring) lyricSpring.targetY = newY;

            if (!isOverscrolling) {
                let closestIndex = -1, minDistance = Infinity;
                document.querySelectorAll('.lyric-line').forEach((el, index) => {
                    const elCenter = el.offsetTop + newY + (el.clientHeight / 2);

            const colorImg = new Image();
            colorImg.crossOrigin = "Anonymous";
            colorImg.src = imgUrl;
            colorImg.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 50; canvas.height = 50;
                    ctx.drawImage(colorImg, 0, 0, 50, 50);
                    const data = ctx.getImageData(0, 0, 50, 50).data;
                    let r=0, g=0, b=0, count=0;
                    for(let i=0; i<data.length; i+=16) { r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++; }
                    r=Math.floor(r/count); g=Math.floor(g/count); b=Math.floor(b/count);
                    const max = Math.max(r, g, b);
                    if (max > 0 && max < 200) { const factor = 200 / max; r = Math.min(255, Math.floor(r * factor)); g = Math.min(255, Math.floor(g * factor)); b = Math.min(255, Math.floor(b * factor)); } 
                    else if (max === 0) { r = 220; g = 186; b = 247; }
                    
                    document.documentElement.style.setProperty('--lyric-accent', `rgb(${r}, ${g}, ${b})`);
                    
                    window.albumParticleRGB = `${r}, ${g}, ${b}`;

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const parsed = [];
            const timeRegEx = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            lines.forEach(line => {
                const match = line.match(timeRegEx);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const milliseconds = match[3].length === 2 ? parseInt(match[3]) * 10 : parseInt(match[3]);
                    const time = (minutes * 60) + seconds + (milliseconds / 1000);
                    let text = line.replace(timeRegEx, '').trim();
                    if (text === '' || text === '♪' || text === '♫') text = '•••';
                    parsed.push({ time, text });
                }
            });
            const processedLyrics = [];
            for (let i = 0; i < parsed.length; i++) {
                processedLyrics.push(parsed[i]);
                if (i < parsed.length - 1) {
                    const gap = parsed[i+1].time - parsed[i].time;
                    if (gap > 8 && parsed[i].text !== '•••') {
                        processedLyrics.push({ time: parsed[i].time + 2, text: '•••' });
                    }
                }
            }
            if (processedLyrics.length > 0 && processedLyrics[0].time > 5) {
                processedLyrics.unshift({ time: 0, text: '•••' });
            }
            return processedLyrics;
        }

        async function fetchLyrics(fileUrl) {
            lyricFetchTicket++;
            const myTicket = lyricFetchTicket;
            lyricsWrapper.innerHTML = '<div class="lyric-line">Loading...</div>';
            currentLyrics = []; activeLyricIndex = -1; lyricsWrapper.style.transform = `translateY(0px)`;
            try {
                const fileName = fileUrl.split('/').pop().replace('.opus', '.lrc');
                const lrcUrl = `https://kazikate.github.io/Biography/music/lyric/${fileName}`;
                const res = await fetch(lrcUrl);
                if (res.ok) {
                    const lrcText = await res.text();
                    if (myTicket === lyricFetchTicket) {
                        currentLyrics = parseLRC(lrcText);
                        currentLyrics.sort((a, b) => a.time - b.time);
                        lyricsWrapper.innerHTML = '';
                        currentLyrics.forEach((line, index) => {
                            const el = document.createElement('div');
                            el.className = 'lyric-line';
                            el.id = `lyric-${index}`.trim();
                            if (line.text === '•••') {
                                el.innerHTML = '<span class="lyric-dot"></span><span class="lyric-dot"></span><span class="lyric-dot"></span>';
                                el.classList.add('instrumental');
                            } else {
                                el.innerText = line.text;
                            }
                            lyricsWrapper.appendChild(el);
                        });
                        activeLyricIndex = -99;
                        syncLyricPosition();
                        return;
                    }
                } else {
                    if (myTicket === lyricFetchTicket) lyricsWrapper.innerHTML = '<div class="lyric-line">Sözler klasörde bulunamadı.</div>';
                }
            } catch (err) {
                if (myTicket === lyricFetchTicket) lyricsWrapper.innerHTML = '<div class="lyric-line">Bağlantı hatası.</div>';
            }
        }

                    <img src="${icon.icon}" alt="${icon.platform}" class="mini-icon">
                </a>
            `).join('\n');
        }

        function renderLinks(containerId, linksArray) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = linksArray.map((link, index) => `
                <a href="${link.url}" target="_blank" class="link-button" style="transition-delay: ${0.9 + (index * 0.1)}s;">
                    <div class="link-img-placeholder" style="background-image: url('${link.bg}');"></div>
                    <div class="link-text-details">
                        <span class="link-platform">${link.platform}</span>
                        ${link.username ? `<span class="link-username">${link.username}</span>` : ''}
                    </div>
                </a>
            `).join('\n');
        }

        let kazikateData = null;
        let twinData = null;

        document.addEventListener('DOMContentLoaded', () => {
            const elementsToAnimate = [
                profileImgContainer, 
                ...document.querySelectorAll('.username'), 
                ...document.querySelectorAll('.bio')
            ].filter(el => el != null);
            
            setTimeout(() => { elementsToAnimate.forEach(el => { el.classList.add('is-visible'); }); }, 50);

            // 3 AYRI DOSYAYI AYNI ANDA ÇEK
            Promise.all([
                fetch('music.json').then(res => res.json()),
                fetch('kazikate.json').then(res => res.json()),
                fetch('twin.json').then(res => res.json())
            ])
            .then(([music, kazikate, twin]) => {
                playlist = music.playlist;
                kazikateData = kazikate;
                twinData = twin;
                
                renderMiniIcons('kazikate-mini-icons', kazikate.miniIcons);
                renderLinks('kazikate-links', kazikate.links);

                renderMiniIcons('twin-mini-icons', twin.miniIcons);
                renderLinks('twin-links', twin.links);

                // TWIN VERSİYONU İÇİN: İlk açılışta KATE (TWIN) fotoğraflarını ayarla
                document.querySelector('.profile-img-visual').style.backgroundImage = `url('${twin.profilePhoto}')`;
                document.querySelector('.downloadable-profile-img').src = twin.profilePhoto;
                const initialPreviewImg = document.getElementById('preview-image');
                initialPreviewImg.src = twin.modalPhoto;
                updateModalGlow(twin.modalPhoto);
                window.currentProfileBg = twin.profilePhoto;
                window.particleRGB = '138, 55, 138';

                setTimeout(() => {
                    document.querySelectorAll('#kazikate-mini-icons, #twin-mini-icons, .link-button').forEach(el => {
                        el.classList.add('is-visible');
                    });
                }, 50);
            })
            .catch(err => {
                console.error("JSON yükleme hatası:", err);
            });

            const parallaxRatio = 0.4; const maxScroll = 200; const maxBlur = 10; const maxDimOpacity = 0.6; let ticking = false;
            function updateEffects() {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const scrollY = Math.max(0, -document.body.getBoundingClientRect().top);
                        if (isLyricsMode) {
                            if (scrollY > 150) toggleLyrics();
                            profileImgContainer.style.transform = `translate3d(-50%, ${scrollY * parallaxRatio}px, 0)`;
                            ticking = false; return;
                        }
                        const scrollRatio = Math.min(scrollY, maxScroll) / maxScroll;
                        profileImgContainer.style.transform = `translate3d(-50%, ${scrollY * parallaxRatio}px, 0)`;
                        profileImgVisual.style.filter = `blur(${scrollRatio * maxBlur}px)`;
                        dimOverlay.style.opacity = scrollRatio * maxDimOpacity;
                        if (scrollY > 30) { profileImgContainer.classList.add('scrolled-past'); } else { profileImgContainer.classList.remove('scrolled-past'); }
                        ticking = false;
                    }); ticking = true;
                }
            }
            window.addEventListener('scroll', updateEffects, { passive: true });
            window.addEventListener('touchmove', updateEffects, { passive: true });
            updateEffects();

            setTimeout(() => {
                document.body.classList.add('animations-done');
                if (profileImgContainer) { setTimeout(() => { profileImgContainer.classList.add('show-hint'); setTimeout(() => { profileImgContainer.classList.remove('show-hint'); }, 1000); }, 300); }
            }, 2200);

            const modal = document.getElementById('image-preview-modal');
            const modalContent = document.querySelector('.modal-content');
            let initialDistance = 0; let currentScale = 1; let isPinching = false; const MIN_TOUCHES_FOR_PINCH = 2;

            function closeModal() {
                if (!modal.classList.contains('is-open')) return;
                modal.classList.remove('is-open'); document.removeEventListener('keydown', handleEscape);
                document.body.classList.remove('no-scroll'); document.body.classList.remove('is-modal-open');
                modalContent.style.transition = SPRING_TRANSITION; modalContent.style.transform = `scale(0)`;
                currentScale = 1; isPinching = false;
                if (history.state && history.state.modal === MODAL_STATE_NAME) { if (history.length > 0) { history.back(); } }
            }
            function openModal() {
                if (isLyricsMode) return;
                if (modal.classList.contains('is-open')) return;
                if (!history.state || history.state.modal !== MODAL_STATE_NAME) { history.pushState({ modal: MODAL_STATE_NAME }, '', window.location.href); }
                document.body.classList.add('no-scroll'); document.body.classList.add('is-modal-open');
                modalContent.style.transition = SPRING_TRANSITION; modalContent.style.transform = `scale(0)`;
                modal.classList.add('is-open'); setTimeout(() => { modalContent.style.transform = `scale(1)`; }, 10);
                modal.onclick = (event) => { if (event.target.id !== 'preview-image') { closeModal(); } };
                document.addEventListener('keydown', handleEscape, { once: true });
            }
            function handleEscape(e) { if (e.key === 'Escape') closeModal(); }
            window.addEventListener('popstate', (e) => {
                if (modal.classList.contains('is-open') && (!e.state || e.state.modal !== MODAL_STATE_NAME)) {
                    modal.classList.remove('is-open'); document.body.classList.remove('no-scroll'); document.body.classList.remove('is-modal-open');
                    modalContent.style.transition = SPRING_TRANSITION; modalContent.style.transform = `scale(0)`;
                }
            });
            profileImgContainer.addEventListener('click', openModal);
            modal.addEventListener('touchstart', (e) => {
                if (e.touches.length === MIN_TOUCHES_FOR_PINCH) {
                    e.preventDefault(); modalContent.style.transition = 'none'; initialDistance = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY); isPinching = true;
                } else { isPinching = false; }
            }, { passive: false });
            modal.addEventListener('touchmove', (e) => {
                if (!isPinching) return; e.preventDefault();
                const newDistance = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
                const scaleFactor = newDistance / initialDistance; currentScale = Math.min(Math.max(scaleFactor, 0.5), 4.0);
                modalContent.style.transform = `scale(${currentScale})`;
            }, { passive: false });
            modal.addEventListener('touchend', () => {
                if (!isPinching) return; isPinching = false;
                modalContent.style.transition = SPRING_TRANSITION; modalContent.style.transform = `scale(1)`; currentScale = 1;
            });
        });

        document.addEventListener('touchstart', () => { document.body.classList.add('is-touching'); }, { passive: true });
        document.addEventListener('mousemove', (e) => { if (e.movementX !== 0 || e.movementY !== 0) { document.body.classList.remove('is-touching'); } }, { passive: true });

        document.addEventListener('mousemove', (e) => {
            if (!document.body.classList.contains('is-touching') && document.body.classList.contains('animations-done')) {
                if (e.target.closest('.social-icons-mini a')) {
                    const icon = e.target.closest('.social-icons-mini a');
                    const rect = icon.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2; const y = e.clientY - rect.top - rect.height / 2;
                    icon.style.transform = `translate(${x * 0.4}px, ${y * 0.4}px) scale(1.15)`; icon.style.transition = 'transform 0.1s ease-out';
                }
            }
        });
        
        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('.social-icons-mini a')) {
                const icon = e.target.closest('.social-icons-mini a');
                icon.style.transform = ''; icon.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            }
        });
        
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.link-button');
            if (btn) {
                btn.classList.remove('press'); void btn.offsetWidth; btn.classList.add('press'); setTimeout(() => { btn.classList.remove('press'); }, 200);
            }
        });

        (function() {
            window.particleRGB = '138, 55, 138'; 
            const canvas = document.getElementById('particle-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d'); let width, height; let particles = []; let tiltX = 0; let tiltY = 0;
            function resizeCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeCanvas); resizeCanvas();
            class Particle {
                constructor() {
                    this.x = Math.random() * width; this.y = Math.random() * height;
                    this.size = Math.random() * 2.0 + 1.0; this.speedX = Math.random() * 0.5 - 0.2; this.speedY = Math.random() * -0.5 - 0.2;
                    this.opacity = Math.random() * 0.35 + 0.15;
                }
                update() {
                    const depth = this.size * 0.4; this.x += this.speedX + (tiltX * 0.02 * depth); this.y += this.speedY + (tiltY * 0.02 * depth);
                    if (this.y < -10) this.y = height + 10; if (this.x < -10) this.x = width + 10;
                    if (this.x > width + 10) this.x = -10; if (this.y > height + 10) this.y = -10;
                }
                draw() { 
                    ctx.fillStyle = `rgba(${window.particleRGB}, ${this.opacity})`; 
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); 
                }
            }
            for (let i = 0; i < 45; i++) { particles.push(new Particle()); }
            function animateParticles() { ctx.clearRect(0, 0, width, height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
            animateParticles();
            window.addEventListener('deviceorientation', (e) => { if(e.gamma !== null && e.beta !== null) { tiltX = e.gamma; tiltY = e.beta; } }, { passive: true });
        })();

        function stopHaptics() { clearTimeout(window.globalHoldTimer); if (navigator.vibrate) navigator.vibrate(0); }
        document.addEventListener('pointerup', stopHaptics);
        document.addEventListener('pointercancel', stopHaptics);
        window.addEventListener('scroll', stopHaptics, { passive: true });
            
        function toggleProfile(target) {
            if (!kazikateData || !twinData) return; 
            
            const currentPanel = target === 'twin' ? document.getElementById('kazikate-panel') : document.getElementById('twin-panel');
            const titleEl = currentPanel.querySelector('.username-switch');
            
            titleEl.classList.add('icon-spin-active');
            setTimeout(() => {
                if (navigator.vibrate) navigator.vibrate(15);
                setTimeout(() => {
                    titleEl.classList.remove('icon-spin-active');
                    const kazikatePanel = document.getElementById('kazikate-panel');
                    const twinPanel = document.getElementById('twin-panel');
                    const visualBg = document.querySelector('.profile-img-visual');
                    const downloadableImg = document.querySelector('.downloadable-profile-img');
                    const previewImage = document.getElementById('preview-image');
                    
                    const kazikateBg = kazikateData.profilePhoto;
                    const kazikateModal = kazikateData.modalPhoto;
                    const twinBg = twinData.profilePhoto; 
                    const twinModal = twinData.modalPhoto;

                    if (target === 'twin') {
                        window.currentProfileBg = twinBg; 
                        kazikatePanel.classList.remove('active-panel'); kazikatePanel.classList.add('hidden-panel');
                        twinPanel.classList.remove('hidden-panel'); twinPanel.classList.add('active-panel');
                        
                        if (!isLyricsMode) { visualBg.style.backgroundImage = `url('${twinBg}')`; window.particleRGB = '138, 55, 138'; }
                        
                        downloadableImg.src = twinBg; previewImage.src = twinModal;
                        updateModalGlow(twinModal); document.body.classList.add('is-twin-active');
                    } else {
                        window.currentProfileBg = kazikateBg; 
                        twinPanel.classList.remove('active-panel'); twinPanel.classList.add('hidden-panel');
                        kazikatePanel.classList.remove('hidden-panel'); kazikatePanel.classList.add('active-panel');
                        
                        if (!isLyricsMode) { visualBg.style.backgroundImage = `url('${kazikateBg}')`; window.particleRGB = '157, 80, 255'; }
                        
                        downloadableImg.src = kazikateBg; previewImage.src = kazikateModal;
                        updateModalGlow(kazikateModal); document.body.classList.remove('is-twin-active');
                    }
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 0); 
            }, 300); 
        }
    </script>
    <div class="bottom-blur-layer"></div>
</body>
</html>
